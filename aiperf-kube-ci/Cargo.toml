[package]
name = "aiperf-kube-portability-ci"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.104"
base64 = "=0.22.1"
chrono = "=0.4.45"
jsonpath-rust = "=0.7.5"
kube = { version = "=0.98.0", default-features = false, features = ["config"] }
k8s-openapi = { version = "=0.24.0", features = ["v1_31"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["full"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "=3.27.0"
